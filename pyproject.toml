[project]
name = "bdd"
version = "0.1.0"
description = "Bharat Data Detective - AI forensic and evidence-trust layer for Indian public data"
requires-python = ">=3.12"

dependencies = [
    "bdd-contracts",
    "bdd-ingestion",
    "bdd-forensics",
    "bdd-api",
    "bdd-evaluation",
    "bdd-cli",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "python-docx>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.workspace]
members = [
    "packages/*",
    "pipelines/*",
    "services/*",
]

[tool.uv.sources]
bdd-contracts = { workspace = true }
bdd-ingestion = { workspace = true }
bdd-forensics = { workspace = true }
bdd-api = { workspace = true }
bdd-evaluation = { workspace = true }
bdd-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdd"]
