# Backend blueprint for Render's free tier.
#
# Only the API and its database live here. The dashboard is served from
# Vercel, so deploying a second copy of it would just create a competing
# frontend and burn another free service slot. Point the Vercel project's
# BACKEND_ORIGIN at this service's URL once it is live.
#
# Two free-tier limits worth knowing: a free web service sleeps after about
# 15 minutes idle and takes roughly a minute to answer the next request, and
# a free Postgres instance is removed after 30 days.
services:
  - type: web
    name: bdd-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Render hands out a postgres:// URL. Settings rewrites it to the
      # psycopg dialect SQLAlchemy needs, so it can be used verbatim.
      - key: BDD_DATABASE_URL
        fromDatabase:
          name: bdd-db
          property: connectionString
      - key: BDD_RAW_STORE
        value: /data/raw
      - key: BDD_MANIFEST_DIR
        value: /data/manifests
      # The browser calls this API directly from the deployed dashboard, so
      # that origin has to be allowed explicitly.
      - key: BDD_CORS_ORIGINS
        value: https://web-tau-sandy-60.vercel.app,http://localhost:3000
databases:
  - name: bdd-db
    plan: free
    databaseName: bdd
    user: bdd
