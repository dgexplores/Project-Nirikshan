[project]
name = "bdd-api"
version = "0.1.0"
description = "BDD FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "bdd-contracts",
    "bdd-ingestion",
    "bdd-forensics",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "polars>=1.5",
    "psycopg[binary]>=3.2; platform_system != 'Windows'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
