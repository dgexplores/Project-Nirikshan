[project]
name = "bdd-cli"
version = "0.1.0"
description = "Command line interface for Bharat Data Detective"
requires-python = ">=3.12"
dependencies = [
    "bdd-contracts",
    "bdd-api",
]

[project.scripts]
bdd = "bdd_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdd_cli"]
