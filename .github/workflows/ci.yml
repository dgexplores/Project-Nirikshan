name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --frozen --all-packages || uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest

      - name: Benchmark leakage guard
        run: uv run pytest tests/test_leakage.py -v

  docker-api:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api .
      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web .
