services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      BDD_DATABASE_URL: postgresql+psycopg://bdd:bdd_local_only@postgres:5432/bdd
      BDD_RAW_STORE: /data/raw
      BDD_MANIFEST_DIR: /data/manifests
      BDD_FIXTURES_DIR: /app/data/fixtures/public
      BDD_CORS_ORIGINS: http://localhost:3000
      # Optional LLM for Ask Detective synthesis (any OpenAI-compatible endpoint)
      BDD_LLM_BASE_URL: ${BDD_LLM_BASE_URL:-}
      BDD_LLM_API_KEY: ${BDD_LLM_API_KEY:-}
      BDD_LLM_MODEL: ${BDD_LLM_MODEL:-}
    volumes:
      - raw_store:/data/raw
      - manifests:/data/manifests
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      BACKEND_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bdd
      POSTGRES_PASSWORD: bdd_local_only
      POSTGRES_DB: bdd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdd -d bdd"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  raw_store:
  manifests:
  pgdata:
